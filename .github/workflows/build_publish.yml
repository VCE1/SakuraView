name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get app version
        id: get_version
        shell: bash
        run: |
          RAW_VER=$(grep -E '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          VER=${RAW_VER%%+*}
          BUILD_NUM=${RAW_VER##*+}
          if [ "$BUILD_NUM" = "$RAW_VER" ] || [ -z "$BUILD_NUM" ]; then BUILD_NUM=1; fi
          BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Setup optional Android keystore
        shell: bash
        env:
          ENCODED_KEYSTORE: ${{ secrets.ENCODED_KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ] && [ -n "$KEY_PROPERTIES" ]; then
            echo "$ENCODED_KEYSTORE" | base64 -d > android/app/upload-keystore.jks
            printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build split APKs
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=APP_VERSION="${{ steps.get_version.outputs.version }}" \
            --dart-define=APP_BUILD_NUMBER="${{ steps.get_version.outputs.build_number }}" \
            --dart-define=BUILD_TIME="${{ steps.get_version.outputs.build_time }}"
          mkdir -p dist/android
          cp build/app/outputs/apk/release/app-arm64-v8a-release.apk "dist/android/SakuraView-${{ steps.get_version.outputs.version }}-arm64-v8a.apk"
          cp build/app/outputs/apk/release/app-armeabi-v7a-release.apk "dist/android/SakuraView-${{ steps.get_version.outputs.version }}-armeabi-v7a.apk"
          cp build/app/outputs/apk/release/app-x86_64-release.apk "dist/android/SakuraView-${{ steps.get_version.outputs.version }}-x86_64.apk"

      - name: Upload Android APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/android/*.apk
          if-no-files-found: error

  build_ios:
    name: Build iOS & iPadOS IPA (Unsigned)
    runs-on: macos-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ios-pods-${{ hashFiles('ios/Podfile', 'pubspec.lock') }}
          restore-keys: ios-pods-

      - name: Get app version
        id: get_version
        shell: bash
        run: |
          RAW_VER=$(grep -E '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          VER=${RAW_VER%%+*}
          BUILD_NUM=${RAW_VER##*+}
          if [ "$BUILD_NUM" = "$RAW_VER" ] || [ -z "$BUILD_NUM" ]; then BUILD_NUM=1; fi
          BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Flutter pub get & iOS precache
        run: |
          flutter pub get
          flutter precache --ios

      - name: Install Pods & build unsigned .app
        run: |
          cd ios
          pod update
          cd ..
          flutter build ios --release --no-codesign \
            --dart-define=APP_VERSION="${{ steps.get_version.outputs.version }}" \
            --dart-define=APP_BUILD_NUMBER="${{ steps.get_version.outputs.build_number }}" \
            --dart-define=BUILD_TIME="${{ steps.get_version.outputs.build_time }}"
          chmod +x thin-payload.sh
          sh thin-payload.sh build/ios/iphoneos/*.app
          mkdir -p build/Payload dist/ios
          mv build/ios/iphoneos/*.app build/Payload/
          (cd build && zip -9 -r "../dist/ios/SakuraView-${{ steps.get_version.outputs.version }}-iOS-nosign.ipa" Payload)

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/ios/*.ipa
          if-no-files-found: error

  release:
    name: Publish Direct APK & IPA Release
    needs: [build_android, build_ios]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-assets

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ needs.build_android.outputs.version }}-$(date +'%Y%m%d%H%M')" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with direct .apk & .ipa files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: SakuraView ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
