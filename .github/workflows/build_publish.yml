name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.4'

permissions:
  contents: write

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get app version
        id: get_version
        shell: bash
        run: |
          RAW_VER=$(grep -E '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          VER=${RAW_VER%%+*}
          BUILD_NUM=${RAW_VER##*+}
          if [ "$BUILD_NUM" = "$RAW_VER" ] || [ -z "$BUILD_NUM" ]; then BUILD_NUM=1; fi
          BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Setup optional Android keystore
        shell: bash
        env:
          ENCODED_KEYSTORE: ${{ secrets.ENCODED_KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ] && [ -n "$KEY_PROPERTIES" ]; then
            echo "$ENCODED_KEYSTORE" | base64 -d > android/app/upload-keystore.jks
            printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build split APKs
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=APP_VERSION="${{ steps.get_version.outputs.version }}" \
            --dart-define=APP_BUILD_NUMBER="${{ steps.get_version.outputs.build_number }}" \
            --dart-define=BUILD_TIME="${{ steps.get_version.outputs.build_time }}"
          mkdir -p dist/android
          cp build/app/outputs/apk/release/app-arm64-v8a-release.apk "dist/android/SakuraView-${{ steps.get_version.outputs.version }}-arm64-v8a.apk"
          cp build/app/outputs/apk/release/app-armeabi-v7a-release.apk "dist/android/SakuraView-${{ steps.get_version.outputs.version }}-armeabi-v7a.apk"
          cp build/app/outputs/apk/release/app-x86_64-release.apk "dist/android/SakuraView-${{ steps.get_version.outputs.version }}-x86_64.apk"

      - name: Upload Android APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/android/*.apk
          if-no-files-found: error

  build_ios:
    name: Build iOS & iPadOS IPA (Unsigned)
    runs-on: macos-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ios-pods-${{ env.FLUTTER_VERSION }}-${{ hashFiles('ios/Podfile', 'pubspec.lock') }}
          restore-keys: ios-pods-${{ env.FLUTTER_VERSION }}-

      - name: Get app version
        id: get_version
        shell: bash
        run: |
          RAW_VER=$(grep -E '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          VER=${RAW_VER%%+*}
          BUILD_NUM=${RAW_VER##*+}
          if [ "$BUILD_NUM" = "$RAW_VER" ] || [ -z "$BUILD_NUM" ]; then BUILD_NUM=1; fi
          BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Flutter pub get & iOS precache
        run: |
          flutter pub get
          flutter precache --ios
          flutter build ios --config-only --release --no-codesign \
            --dart-define=APP_VERSION="${{ steps.get_version.outputs.version }}" \
            --dart-define=APP_BUILD_NUMBER="${{ steps.get_version.outputs.build_number }}" \
            --dart-define=BUILD_TIME="${{ steps.get_version.outputs.build_time }}"

      - name: Install Pods & build unsigned .app
        run: |
          cd ios
          pod install --repo-update
          cd ..
          flutter build ios --release --no-codesign \
            --dart-define=APP_VERSION="${{ steps.get_version.outputs.version }}" \
            --dart-define=APP_BUILD_NUMBER="${{ steps.get_version.outputs.build_number }}" \
            --dart-define=BUILD_TIME="${{ steps.get_version.outputs.build_time }}"
          chmod +x thin-payload.sh
          sh thin-payload.sh build/ios/iphoneos/*.app
          mkdir -p build/Payload dist/ios
          mv build/ios/iphoneos/*.app build/Payload/
          (cd build && zip -9 -r "../dist/ios/SakuraView-${{ steps.get_version.outputs.version }}-iOS-nosign.ipa" Payload)

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/ios/*.ipa
          if-no-files-found: error

  build_windows:
    name: Build Windows x64 Portable ZIP
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get app version
        id: get_version
        shell: pwsh
        run: |
          $line = (Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1)
          $rawVer = ($line -replace '^version:\s*', '').Trim()
          $parts = $rawVer.Split('+', 2)
          $ver = $parts[0]
          $buildNum = if ($parts.Length -gt 1 -and $parts[1]) { $parts[1] } else { '1' }
          $tz = [System.TimeZoneInfo]::FindSystemTimeZoneById('China Standard Time')
          $buildTime = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $tz).ToString('yyyy-MM-dd HH:mm:ss')
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "build_number=$buildNum" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "build_time=$buildTime" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release & package portable ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          $buildNum = "${{ steps.get_version.outputs.build_number }}"
          $buildTime = "${{ steps.get_version.outputs.build_time }}"
          flutter build windows --release `
            --dart-define="APP_VERSION=$ver" `
            --dart-define="APP_BUILD_NUMBER=$buildNum" `
            --dart-define="BUILD_TIME=$buildTime"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/windows/SakuraView-$ver-windows-x64.zip" -Force

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/windows/*.zip
          if-no-files-found: error

  release:
    name: Publish Versioned APK, IPA & Windows Release
    needs: [build_android, build_ios, build_windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-assets

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: release-assets

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ needs.build_android.outputs.version }}-$(date +'%Y%m%d%H%M')" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with direct .apk, .ipa & .zip files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: SakuraView ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*

  publish_latest:
    name: Publish Direct APK, IPA & Windows ZIP (Pre-release)
    needs: [build_android, build_ios, build_windows]
    if: ${{ !cancelled() && (needs.build_android.result == 'success' || needs.build_ios.result == 'success' || needs.build_windows.result == 'success') && !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Upload direct .apk, .ipa & .zip files to latest-build pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t ASSETS < <(find release-assets -type f \( -name '*.apk' -o -name '*.ipa' -o -name 'SakuraView-*-windows-*.zip' \) | sort)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No built .apk, .ipa or Windows .zip files found" >&2
            exit 1
          fi

          TAG="latest-build"
          SHORT_SHA="${GITHUB_SHA::7}"
          NOTES="Automated build for commit \`${SHORT_SHA}\` (\`${{ github.ref_name }}\`). Direct .apk, .ipa & Windows portable .zip builds."

          if gh release view "$TAG" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$TAG" "$asset" -y || true
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/${TAG}" -f sha="${GITHUB_SHA}" -F force=true || true
            gh release edit "$TAG" --target "${GITHUB_SHA}" --title "Latest Build (${SHORT_SHA})" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" --target "${GITHUB_SHA}" --title "Latest Build (${SHORT_SHA})" --notes "$NOTES" --prerelease
          fi

          gh release upload "$TAG" "${ASSETS[@]}" --clobber

          {
            echo "### Direct Downloads (Uncompressed Release Assets)"
            echo ""
            for f in "${ASSETS[@]}"; do
              name=$(basename "$f")
              echo "- [${name}](https://github.com/${{ github.repository }}/releases/download/${TAG}/${name})"
            done
          } >> "$GITHUB_STEP_SUMMARY"
