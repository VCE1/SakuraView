name: vce1_sakuraview
description: "A cute and modern anime image viewer for Danbooru, Yande.re, Zerochan, and more."
publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ">=3.3.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^4.0.3
  http: ^1.2.2
  flutter_staggered_grid_view: ^0.7.0
  logging: ^1.2.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  shimmer: ^4.0.0
  flutter_downloader: ^1.12.0
  cupertino_icons: ^2.0.0
  crypto: ^3.0.6
  intl: ^0.20.2
  url_launcher: ^6.3.1
  dio: ^5.7.0
  file_picker: ^11.0.3
  photo_view: ^0.15.0
  provider: ^6.1.5
  html: ^0.15.5
  photo_manager: ^3.7.1
  path: ^1.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  xml: ^7.0.1
  google_fonts: ^8.2.1
  bitsdojo_window: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
